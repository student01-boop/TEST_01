<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}바이브코딩스쿨{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { font-family: 'Segoe UI', sans-serif; }
    .navbar-brand { font-weight: 700; font-size: 1.4rem; }
    .hero {
      background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
      color: white;
      padding: 100px 0;
    }
    .hero h1 { font-size: 3rem; font-weight: 800; }
    .hero p  { font-size: 1.25rem; opacity: .9; }
    footer   { background: #1e1e2e; color: #aaa; padding: 32px 0; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- 네비게이션 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand" href="/">🎓 바이브코딩스쿨</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">홈</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">소개</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">연락처</a></li>
        </ul>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <!-- 푸터 -->
  <footer class="text-center">
    <div class="container">
      <p class="mb-1">© 2026 바이브코딩스쿨. All rights reserved.</p>
      <small>Python · Flask · Bootstrap 5</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
