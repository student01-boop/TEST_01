{% extends "base.html" %}

{% block title %}연락처 — 바이브코딩스쿨{% endblock %}

{% block content %}

<section class="py-5">
  <div class="container" style="max-width: 600px;">
    <h2 class="fw-bold mb-2">연락처</h2>
    <p class="text-muted mb-5">궁금한 점이 있으면 언제든지 문의해 주세요.</p>

    <div class="mb-4">
      <p class="mb-2">📧 <strong>이메일</strong> — hello@vibecoding.school</p>
      <p class="mb-2">📞 <strong>전화</strong> — 02-1234-5678</p>
      <p class="mb-0">📍 <strong>주소</strong> — 서울특별시 강남구 테헤란로 123</p>
    </div>

    <hr class="my-4" />

    <h5 class="fw-bold mb-3">문의 남기기</h5>
    <form>
      <div class="mb-3">
        <label class="form-label">이름</label>
        <input type="text" class="form-control" placeholder="홍길동" />
      </div>
      <div class="mb-3">
        <label class="form-label">이메일</label>
        <input type="email" class="form-control" placeholder="example@email.com" />
      </div>
      <div class="mb-3">
        <label class="form-label">문의 내용</label>
        <textarea class="form-control" rows="4" placeholder="궁금한 점을 입력해 주세요."></textarea>
      </div>
      <button type="submit" class="btn btn-primary px-4">보내기</button>
    </form>
  </div>
</section>

{% endblock %}
