name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 세팅
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: Flask 앱 import 확인
        run: python -c "from app import app; print('✅ app import 성공')"

      - name: flake8 코드 스타일 검사
        run: |
          pip install flake8
          flake8 app.py --max-line-length=100
